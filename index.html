<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tabs Example</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Sujjay Karthikeyan</h2>

    <div class="tab-buttons">
        <button class="tab-link active" onclick="openTab(event, 'Tab1')">About</button>
        <button class="tab-link" onclick="openTab(event, 'Tab2')">Projects</button>
        <button class="tab-link" onclick="openTab(event, 'Tab3')">Repositories</button>
    </div>

    <div id="Tab1" class="tab-content" style="display:block;">
        <h3>Sujjay Karthikeyan</h3>
        <p>London is the capital of England.</p>
    </div>

    <div id="Tab2" class="tab-content">
        <h3>Projects</h3>
        <p>Paris is the capital of France.</p> 
    </div>

    <div id="Tab3" class="tab-content">
        <h3>Repositories</h3>
        <p>Tokyo is the capital of Japan.</p>
    </div>

    <script src="script.js"></script>

</body>
</html>
